# Production stack: one HTTPS entry point (Caddy) in front of everything.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). The browser loads the app from
# https://<SITE_ADDRESS>/ and calls the API at /api on the same address,
# so there is no CORS and the session cookie is HTTPS-only.
# See DEPLOY.md for the full walkthrough.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compliwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-compliwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: only the backend and backup containers can reach Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-compliwise}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SCHOOL_YEAR: ${SCHOOL_YEAR:-2026-2027}
      CORS_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
      COOKIE_SECURE: "true"
    # One worker: schedule-generation progress is kept in this process's
    # memory. Proxy headers make the audit log record the browser's IP
    # rather than Caddy's; safe because only Caddy can reach this port.
    command:
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/setup/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the page, so it never needs changing per server.
        VITE_API_URL: /api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates (and Caddy's internal CA, if used) must survive restarts.
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump into ./backups, keeping BACKUP_KEEP_DAYS days.
  # These files sit on the same machine as the database: copy them
  # somewhere else too (see DEPLOY.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-compliwise}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-compliwise}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/compliwise-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump --format=custom --file="$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup: wrote $$f"
          else
            rm -f "$$f.tmp"
            echo "backup: FAILED" >&2
          fi
          find /backups -name 'compliwise-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
