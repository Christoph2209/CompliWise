server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app, falling back to index.html for client-side routing.
    # No API proxy here — the frontend's axios client calls the backend
    # directly via VITE_API_URL (baked in at build time), so browsers hit
    # the backend's exposed port directly rather than routing through here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}